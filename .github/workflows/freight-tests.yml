name: Freight Domain Tests

on:
  pull_request:
    paths:
      - 'freight/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'freight/**'
      - 'package.json'

jobs:
  freight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm test
