name: AOS Object Contract Tests

on:
  pull_request:
    paths:
      - 'mos/commands/**'
      - 'mos/events/**'
      - 'mos/objects/**'
      - 'mos/routes/**'
      - 'mos/tests/objectMutationContract.test.js'
      - '.github/workflows/aos-object-contract-tests.yml'
  push:
    paths:
      - 'mos/commands/**'
      - 'mos/events/**'
      - 'mos/objects/**'
      - 'mos/routes/**'
      - 'mos/tests/objectMutationContract.test.js'
      - '.github/workflows/aos-object-contract-tests.yml'

jobs:
  object-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check mos/objects/objectService.js
          node --check mos/routes/mosRouter.js
          node --check mos/tests/objectMutationContract.test.js

      - name: Verify object mutation contract
        run: node --test mos/tests/objectMutationContract.test.js
