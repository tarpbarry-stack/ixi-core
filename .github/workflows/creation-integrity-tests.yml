name: AOS Creation Integrity Tests

on:
  pull_request:
    paths:
      - 'integrity/**'
      - '.github/workflows/creation-integrity-tests.yml'
  push:
    branches: [main]
    paths:
      - 'integrity/**'
      - '.github/workflows/creation-integrity-tests.yml'

jobs:
  creation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: |
          node -c integrity/creationIntegrityService.js
          node -c integrity/creationIntegrityRouter.js

      - name: Run integrity invariant tests
        run: node --test integrity/creationIntegrityService.test.js
